# Pull requests that change the backend: the Firestore security rules' tests on the Firestore emulator (docs/BACKEND.md).
name: Firestore rules

on:
  pull_request:
    paths:
      - "firebase/**"
      - ".github/workflows/rules.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: firebase
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Firestore emulator needs Java 21; Node.js (for the Firebase CLI) comes with the runner image.
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Rules tests
        run: bun run test
