# Pull requests (from this repository) and manual runs: re-record the Roborazzi screenshots on the runner's Android
# SDK (app/screenshots, wear/screenshots), rebuild the README images (docs/screenshots) and the Google Play images
# (docs/play) from them and push them to the branch when they changed, so the screenshots always show the UI being merged. Pushes made with GITHUB_TOKEN do not
# start other workflows, so this never loops.
name: Screenshots

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # push the re-recorded screenshots to the branch

concurrency:
  group: screenshots-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  record:
    name: Record screenshots
    # A fork's branch cannot be pushed to with this token.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK (platform 37)
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.1.0

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Record the screenshots
        run: ./gradlew --console=plain :app:recordRoborazziDebug :wear:recordRoborazziDebug

      - name: Rebuild the README and Google Play images
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/readme_screenshots.py
          python3 scripts/play_assets.py

      - name: Push them if they changed
        run: |
          git add app/screenshots wear/screenshots docs/screenshots docs/play
          if git diff --cached --quiet; then
            echo "The screenshots are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Re-record the screenshots"
          git push
