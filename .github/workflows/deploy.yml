# Every merge to main that changes the backend: the rules' tests, then the Firestore rules and indexes and the website
# in firebase/hosting/ deployed to Firebase (docs/BACKEND.md §4). Run it by hand to deploy without a change, for example
# after adding the secret.
name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "firebase/firebase.json"
      - "firebase/firestore.rules"
      - "firebase/firestore.indexes.json"
      - "firebase/hosting/**"
      - "firebase/package.json"
      - "firebase/package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy the rules and the website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: firebase
    env:
      SERVICE_ACCOUNT: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - name: No backend configured
        if: env.SERVICE_ACCOUNT == ''
        working-directory: .
        run: echo "::notice::FIREBASE_DEPLOY_SERVICE_ACCOUNT is not set, so nothing is deployed (docs/BACKEND.md)."

      - name: Check out
        if: env.SERVICE_ACCOUNT != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Firestore emulator of the tests needs Java 21; Node.js comes with the runner image.
      - name: Set up JDK 21
        if: env.SERVICE_ACCOUNT != ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install
        if: env.SERVICE_ACCOUNT != ''
        run: npm ci --no-audit --no-fund

      # Never deploy rules that fail their tests.
      - name: Rules tests
        if: env.SERVICE_ACCOUNT != ''
        run: npm test

      - name: Deploy
        if: env.SERVICE_ACCOUNT != ''
        run: |
          key="$RUNNER_TEMP/service-account.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$key"
          trap 'rm -f "$key"' EXIT
          export GOOGLE_APPLICATION_CREDENTIALS="$key"
          project="$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).project_id)" "$key")"
          npm run deploy -- --project "$project" --non-interactive
