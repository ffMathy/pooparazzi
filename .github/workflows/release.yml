# Merges to main: unit tests, signed release bundles (AAB) and APKs of the phone and watch apps, a GitHub Release
# with both APKs for side-loading, and an upload of both bundles to Google Play under the one shared applicationId. Setup (secrets, upload key, service account, the manual first
# upload): docs/RELEASING.md. Without the upload-key secrets the APKs are signed with the public side-load key and
# only the GitHub Release is made.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the bundles to Google Play (off = build them, keep them as an artifact and still create the GitHub Release)
        type: boolean
        default: true
      bump:
        description: Which part of the version to bump (merges to main bump by the merged pull request's release:minor / release:major label, patch otherwise)
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write # create the GitHub Release and its tag
  pull-requests: read # the merged pull request's labels pick the version bump

# One release at a time, in merge order: version codes must reach Play increasing, and each version name bumps the
# tag the previous run pushed.
concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.ffmathy.pooparazzi

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the release secrets
        id: secrets
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          missing=()
          for name in UPLOAD_KEYSTORE_BASE64 UPLOAD_KEYSTORE_PASSWORD UPLOAD_KEY_ALIAS UPLOAD_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          # Without the upload key the APKs are signed with the public side-load key in keystores/ (stable, so each
          # release still installs over the previous one) and nothing goes to Play, which must only get upload-key builds.
          upload_key=true
          if [ ${#missing[@]} -eq 4 ]; then
            upload_key=false
            echo "::warning::No upload-key secrets: signing the APKs with the public side-load key and skipping Google Play (see docs/RELEASING.md)"
          elif [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Upload key partly configured; missing repository secrets: ${missing[*]} (see docs/RELEASING.md)"
            exit 1
          fi
          # Without a Play service account the APKs still go to a GitHub Release; only the Play upload is skipped.
          play=false
          if [ "$PUBLISH" = "true" ] && [ "$upload_key" = "true" ]; then
            if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then play=true
            else echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is not set: skipping the Google Play upload (see docs/RELEASING.md)"; fi
          fi
          echo "upload_key=$upload_key" >> "$GITHUB_OUTPUT"
          echo "play=$play" >> "$GITHUB_OUTPUT"

      - name: Compute version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          VERSION_CODE_OFFSET: ${{ vars.VERSION_CODE_OFFSET || '100' }}
          BUMP: ${{ inputs.bump }}
        run: |
          # One base per run; Gradle derives the phone's code (base * 10) and the watch's (base * 10 + 1).
          base=$((RUN_NUMBER + VERSION_CODE_OFFSET))
          # The name bumps the highest release tag (docs/RELEASING.md#version-names): by hand as chosen, on a merge by
          # the merged pull request's label.
          if [ -z "$BUMP" ]; then
            BUMP=patch
            labels="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[].labels[].name' || true)"
            if grep -qx 'release: *major' <<< "$labels"; then BUMP=major
            elif grep -qx 'release: *minor' <<< "$labels"; then BUMP=minor; fi
          fi
          tags="$(git ls-remote --tags origin)"
          name="$(python3 scripts/next_version.py --bump "$BUMP" <<< "$tags")"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Version $name ($BUMP bump): phone $((base * 10)), watch $((base * 10 + 1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK (platform 37)
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.1.0

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Robolectric's android-all jars come from the Maven Central mirror set for every Test task in the root
      # build.gradle.kts (robolectric.dependency.repo.url / .id).
      - name: Unit tests
        run: ./gradlew --console=plain :core:testDebugUnitTest :app:testDebugUnitTest :wear:testDebugUnitTest

      # The phone app's Firebase configuration (docs/BACKEND.md). Without it the release builds with accounts and the
      # backup turned off, as on pull requests.
      - name: Write the Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            echo "::warning::GOOGLE_SERVICES_JSON is not set: this release has no accounts or backup (see docs/BACKEND.md)"
          fi

      - name: Decode the upload keystore
        if: steps.secrets.outputs.upload_key == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "POOPARAZZI_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # keystores/sideload.jks and its passwords are public on purpose: see docs/RELEASING.md#without-the-upload-key.
      - name: Use the public side-load key
        if: steps.secrets.outputs.upload_key != 'true'
        run: echo "POOPARAZZI_UPLOAD_STORE_FILE=keystores/sideload.jks" >> "$GITHUB_ENV"

      # The check step rejects a partly configured upload key, so the fallbacks apply all together or not at all.
      - name: Build signed release bundles and APKs
        env:
          POOPARAZZI_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD || 'pooparazzi-sideload' }}
          POOPARAZZI_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS || 'sideload' }}
          POOPARAZZI_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD || 'pooparazzi-sideload' }}
          VERSION_BASE: ${{ steps.version.outputs.base }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: >-
          ./gradlew --console=plain :app:bundleRelease :wear:bundleRelease :app:assembleRelease :wear:assembleRelease
          "-Ppooparazzi.versionCode=$VERSION_BASE"
          "-Ppooparazzi.versionName=$VERSION_NAME"

      # Play Services reads the Wear capabilities by name; resource shrinking once dropped them, so the phone said
      # "No watch connected" next to a watch with the app. Fail the release if either APK lacks them.
      - name: Check the Wear capabilities survived shrinking
        run: |
          aapt2="$ANDROID_HOME/build-tools/36.1.0/aapt2"
          for apk in app/build/outputs/apk/release/app-release.apk wear/build/outputs/apk/release/wear-release.apk; do
            dump="$("$aapt2" dump resources "$apk")"
            for name in android_wear_capabilities pooparazzi_tracker pooparazzi_babies; do
              grep -q "$name" <<<"$dump" || { echo "::error::$apk lacks $name (resource shrinking removed it)"; exit 1; }
            done
          done

      - name: Remove the upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Keep the bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-${{ steps.version.outputs.base }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            wear/build/outputs/bundle/release/wear-release.aab
            app/build/outputs/mapping/release/mapping.txt
            wear/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      # Side-loadable APKs, signed with the upload key so each release installs over the previous one. Play installs
      # are re-signed by Play App Signing, so they can't update these (and vice versa).
      - name: Create a GitHub Release with the APKs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_BASE: ${{ steps.version.outputs.base }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          dir="$RUNNER_TEMP/apks"
          mkdir -p "$dir"
          cp app/build/outputs/apk/release/app-release.apk "$dir/pooparazzi-phone-$VERSION_NAME-$VERSION_BASE.apk"
          cp wear/build/outputs/apk/release/wear-release.apk "$dir/pooparazzi-watch-$VERSION_NAME-$VERSION_BASE.apk"
          tag="v$VERSION_NAME"
          gh release create "$tag" "$dir"/*.apk \
            --target "$GITHUB_SHA" \
            --title "Pooparazzi $VERSION_NAME ($VERSION_BASE)" \
            --notes "Phone and watch APKs built from $GITHUB_SHA. Install both from the same release so they sync; see docs/RELEASING.md#side-loading-the-apks."

      # The watch bundle must go to a Wear OS form-factor track ("wear:<track>"): on a phone track Play rejects it
      # (it requires android.hardware.type.watch) and it replaces the phone bundle in that track's draft. A
      # PLAY_WEAR_TRACK given without the prefix (e.g. "beta") gets it here. Wear OS has no "wear:alpha": its closed
      # testing track is "wear:Closed - Wear OS", so the phone's "alpha" maps to that.
      - name: Resolve the Play tracks
        id: tracks
        if: steps.secrets.outputs.play == 'true'
        env:
          PLAY_TRACK: ${{ vars.PLAY_TRACK || 'alpha' }}
          PLAY_WEAR_TRACK: ${{ vars.PLAY_WEAR_TRACK }}
        run: |
          wear="${PLAY_WEAR_TRACK:-$PLAY_TRACK}"
          case "$wear" in
            alpha|wear:alpha) wear="wear:Closed - Wear OS" ;;
          esac
          case "$wear" in
            wear:*) ;;
            *) [ -z "$PLAY_WEAR_TRACK" ] || echo "::warning::PLAY_WEAR_TRACK=$PLAY_WEAR_TRACK is not a Wear OS track; using wear:$wear"
               wear="wear:$wear" ;;
          esac
          case "$PLAY_TRACK" in
            wear:*) echo "::error::PLAY_TRACK=$PLAY_TRACK is a Wear OS track; the phone bundle needs a phone track"; exit 1 ;;
          esac
          echo "phone=$PLAY_TRACK" >> "$GITHUB_OUTPUT"
          echo "wear=$wear" >> "$GITHUB_OUTPUT"
          echo "Play tracks: phone $PLAY_TRACK, watch $wear" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the phone bundle to Google Play
        if: steps.secrets.outputs.play == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          track: ${{ steps.tracks.outputs.phone }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.base }})

      # The watch bundle shares the package but goes to the Wear OS form-factor track (resolved above); the Wear OS
      # form factor must be enabled for the listing first.
      - name: Upload the watch bundle to Google Play
        if: steps.secrets.outputs.play == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: wear/build/outputs/bundle/release/wear-release.aab
          mappingFile: wear/build/outputs/mapping/release/mapping.txt
          track: ${{ steps.tracks.outputs.wear }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.base }}) Wear OS
