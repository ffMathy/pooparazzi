<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Page not found.">
  <title>Not found · Pooparazzi</title>
  <style>
    :root { color-scheme: light dark; --bg: #fbf7f1; --fg: #2b2520; --muted: #6b6058; --accent: #9a4f1d; --line: #e3d9cc; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1b1714; --fg: #f1e8dc; --muted: #b9ab9b; --accent: #f0a868; --line: #3a322b; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 1.0625rem/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 40rem; margin: 0 auto; padding: 2rem 1rem 3rem; }
    h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 1rem; }
    h2 { font-size: 1.2rem; margin: 2rem 0 .5rem; }
    a { color: var(--accent); text-underline-offset: .15em; }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .button { display: inline-block; min-height: 48px; padding: .75rem 1.25rem; border-radius: 999px; background: var(--accent); color: var(--bg); font-weight: 600; text-decoration: none; }
    .muted, footer { color: var(--muted); font-size: .95rem; }
    section + section { border-top: 1px solid var(--line); margin-top: 2rem; padding-top: 1rem; }
    footer { border-top: 1px solid var(--line); margin-top: 2.5rem; padding-top: 1rem; }
    code { font-size: .9em; }

  </style>
</head>
<body>
<main>
<section lang="en">
  <h1>Page not found</h1>
  <p><a href="/">Pooparazzi</a> · <a href="/privacy">Privacy policy</a></p>
</section>
<section lang="da"><p>Siden findes ikke.</p></section>
</main>
</body>
</html>
